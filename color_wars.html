<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Wars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080816;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif}
#wrap{width:100%;max-width:820px;padding:0 10px}
#gc{display:block;width:100%;border-radius:12px;cursor:crosshair;touch-action:none;box-shadow:0 0 40px rgba(32,100,255,.25)}
#ctl{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 0 5px}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 14px rgba(40,110,255,.45)}50%{box-shadow:0 0 32px rgba(60,170,255,.8)}}
#sb{padding:8px 28px;background:linear-gradient(135deg,#1144cc,#2288ff);color:#fff;border:none;border-radius:22px;font:bold 14px system-ui;cursor:pointer;letter-spacing:.5px;transition:all .25s;animation:pulse-btn 2s ease-in-out infinite}
#sb:hover:not(:disabled){transform:scale(1.05)}
#sb:disabled{background:#1a1a28;color:#444;cursor:not-allowed;box-shadow:none;animation:none}
#ht{text-align:center;font:12px system-ui;color:rgba(160,185,255,.4);padding:4px 0 6px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gc"></canvas>
  <div id="ctl">
    <button id="sb" onclick="activateSurge()">&#x26A1; SURGE &nbsp;(Ready!)</button>
  </div>
  <div id="ht">Draw on the battlefield to command your blue troops &nbsp;&bull;&nbsp; SURGE sends all troops charging &nbsp;&bull;&nbsp; SPACE = Surge</div>
</div>
<script>
const cv=document.getElementById('gc'),cx=cv.getContext('2d');
const sb=document.getElementById('sb'),ht=document.getElementById('ht');
const CW=800,CH=520,HH=44,CS=16,GW=50,GH=30;
cv.width=CW;cv.height=CH;
const PL=1,EN=2;
const TC={[PL]:[32,120,255],[EN]:[255,48,72]};

let grid,soldiers,particles,splats,bases,pPath,drawing,pathA,over,winT;
let tSpP,tSpE,tAI,uid,gameTime,waveNum;
let surgeCD=0,SURGE_CD=22000,surgeGlow=0;
let aiMsg='',aiMsgT=0;
let aCtx=null,lastDeathSfx=0,lastCapSfx=0;

// ══ AUDIO ══
function getA(){if(!aCtx)try{aCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return aCtx;}
function note(f,d,v=.22,t='sine'){const a=getA();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d);}
function sfx(t){
  const now=performance.now();
  if(t==='death'){if(now-lastDeathSfx<180)return;lastDeathSfx=now;note(105,.12,'sawtooth',.055);}
  else if(t==='cap'){if(now-lastCapSfx<600)return;lastCapSfx=now;note(660,.18,'sine',.09);}
  else if(t==='surge'){note(200,.07,'square',.2);setTimeout(()=>note(400,.07,'square',.2),85);setTimeout(()=>note(900,.35,'square',.18),170);}
  else if(t==='wave'){note(170,.22,'sawtooth',.07);}
  else if(t==='assault'){note(150,.15,'sawtooth',.12);setTimeout(()=>note(120,.3,'sawtooth',.12),160);}
  else if(t==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>note(f,.4,'sine',.28),i*130));}
  else if(t==='lose'){[392,330,262,196].forEach((f,i)=>setTimeout(()=>note(f,.4,'sine',.28),i*130));}
}

// ══ INIT ══
function init(){
  uid=0;gameTime=0;waveNum=0;surgeCD=0;surgeGlow=0;
  grid=[];
  for(let r=0;r<GH;r++){grid[r]=[];for(let c=0;c<GW;c++)grid[r][c]={own:c<13?PL:c>37?EN:0,pt:c<13?1:c>37?1:0};}
  const my=HH+GH*CS/2;
  bases={[PL]:{x:30,y:my,hp:200,mhp:200},[EN]:{x:CW-30,y:my,hp:200,mhp:200}};
  soldiers=[];particles=[];splats=[];pPath=[];
  drawing=false;pathA=0;over=false;winT=0;aiMsg='';aiMsgT=0;
  tSpP=tSpE=tAI=performance.now();
  for(let i=0;i<8;i++){spawn(PL);spawn(EN);}
  sb.disabled=false;sb.textContent='\u26A1 SURGE \u00a0(Ready!)';
}

// ══ SURGE ══
function activateSurge(){
  if(surgeCD>0||over)return;
  getA();
  surgeCD=SURGE_CD;surgeGlow=1;
  const eb=bases[EN];
  for(const s of soldiers)if(s.t===PL){s.wpts=[{x:eb.x,y:eb.y}];s.st=2600;}
  sfx('surge');
  sb.disabled=true;sb.textContent='\u26A1 SURGE \u00a0(22s)';
}

// ══ SOLDIER CLASS ══
class Sol{
  constructor(t,x,y){
    this.id=uid++;this.t=t;
    this.x=x+rnd(-14,14);this.y=y+rnd(-26,26);
    this.vx=t===PL?.5:-.5;this.vy=rnd(-.3,.3);
    this.spd=rnd(.9,1.45)*(t===EN?1+Math.min(.35,gameTime/180000):1);
    this.hp=40;this.mhp=40;this.r=7;this.wpts=[];
    this.ang=t===PL?0:Math.PI;this.bl=rnd(0,10);this.ptm=0;this.st=0;
  }
  get col(){return cl(~~(this.x/CS),0,GW-1);}
  get row(){return cl(~~((this.y-HH)/CS),0,GH-1);}
  update(dt,all){
    this.bl+=dt*.003;this.ptm+=dt;if(this.st>0)this.st-=dt;
    const eff=this.st>0?this.spd*1.65:this.spd;
    if(this.ptm>90){this.ptm=0;if(paintC(this.col,this.row,this.t,.3))sfx('cap');}
    let foe=null,fd=9999;
    for(const s of all){if(s.t===this.t)continue;const d=h2(s.x-this.x,s.y-this.y);if(d<fd){fd=d;foe=s;}}
    if(foe&&fd<22){foe.hp-=dt/16;this.ang=Math.atan2(foe.y-this.y,foe.x-this.x);this.vx*=.72;this.vy*=.72;}
    else{
      while(this.wpts.length&&h2(this.wpts[0].x-this.x,this.wpts[0].y-this.y)<24)this.wpts.shift();
      const tg=this.wpts[0]||bases[this.t===PL?EN:PL];
      const dx=tg.x-this.x,dy=tg.y-this.y,d=h2(dx,dy)||1;
      this.vx+=dx/d*eff*.18;this.vy+=dy/d*eff*.18;this.ang=Math.atan2(dy,dx);
    }
    for(const s of all){if(s===this)continue;const dx=this.x-s.x,dy=this.y-s.y,d=h2(dx,dy)||1,mn_=this.r+s.r+3;if(d<mn_){const f=(mn_-d)/mn_*.42;this.vx+=dx/d*f;this.vy+=dy/d*f;}}
    const v=h2(this.vx,this.vy),sp=this.st>0?eff:this.spd;if(v>sp){this.vx=this.vx/v*sp;this.vy=this.vy/v*sp;}
    this.x+=this.vx;this.y+=this.vy;
    this.x=cl(this.x,this.r,CW-this.r);this.y=cl(this.y,HH+this.r+2,CH-this.r-2);
    const eb=bases[this.t===PL?EN:PL];if(h2(this.x-eb.x,this.y-eb.y)<30)eb.hp-=.09*dt/16;
  }
  draw(){
    const[cr,cg,cb]=TC[this.t],R=this.r,surging=this.t===PL&&this.st>0;
    cx.save();cx.globalAlpha=.2;cx.beginPath();cx.ellipse(this.x,this.y+R-1,R*.85,R*.32,0,0,Math.PI*2);cx.fillStyle='#000';cx.fill();cx.restore();
    if(surging){cx.save();cx.shadowBlur=16;cx.shadowColor='rgba(90,210,255,.9)';}
    const g=cx.createRadialGradient(this.x-R*.32,this.y-R*.32,1,this.x,this.y,R);
    g.addColorStop(0,surging?'rgb(110,225,255)':`rgb(${mn(cr+62)},${mn(cg+62)},${mn(cb+62)})`);
    g.addColorStop(.65,`rgb(${cr},${cg},${cb})`);
    g.addColorStop(1,`rgb(${mx(cr-52)},${mx(cg-52)},${mx(cb-52)})`);
    cx.beginPath();cx.arc(this.x,this.y,R,0,Math.PI*2);cx.fillStyle=g;cx.fill();
    cx.strokeStyle=surging?'rgba(90,220,255,.95)':`rgba(${mx(cr-60)},${mx(cg-60)},${mx(cb-60)},.8)`;
    cx.lineWidth=surging?2.2:1.5;cx.stroke();
    if(surging)cx.restore();
    const ex=this.x+Math.cos(this.ang)*R*.38,ey=this.y+Math.sin(this.ang)*R*.38;
    cx.beginPath();cx.arc(ex,ey,3.5,0,Math.PI*2);cx.fillStyle='#fff';cx.fill();
    if(Math.sin(this.bl*2.4)>.92){cx.beginPath();cx.moveTo(ex-3,ey);cx.lineTo(ex+3,ey);cx.strokeStyle='#222';cx.lineWidth=1.8;cx.stroke();}
    else{cx.beginPath();cx.arc(ex+Math.cos(this.ang)*1.2,ey+Math.sin(this.ang)*1.2,2,0,Math.PI*2);cx.fillStyle='#111';cx.fill();}
    if(this.hp<this.mhp*.98){
      const bw=R*2.2,bx=this.x-bw/2,by=this.y-R-8;
      cx.fillStyle='#2a2a3a';cx.fillRect(bx,by,bw,3.5);
      const hr=this.hp/this.mhp;cx.fillStyle=hr>.55?'#44ee77':hr>.28?'#ffbb33':'#ff4444';
      cx.fillRect(bx,by,bw*hr,3.5);
    }
  }
}

// ══ HELPERS ══
function rnd(a,b){return a+Math.random()*(b-a);}
function cl(v,a,b){return v<a?a:v>b?b:v;}
function h2(dx,dy){return Math.sqrt(dx*dx+dy*dy);}
function mn(v){return v>255?255:v;}
function mx(v){return v<0?0:v;}
function cc(r,g,b,a=1){return `rgba(${r},${g},${b},${a})`;}

function paintC(c,r,team,amt){
  const ce=grid[r][c];
  if(ce.own!==team){
    ce.pt=Math.max(0,ce.pt-amt);
    if(ce.pt===0){ce.own=team;ce.pt=.2;splats.push({x:c*CS+8,y:r*CS+8+HH,t:team,life:1});return true;}
  }else ce.pt=Math.min(1,ce.pt+amt*.28);
  return false;
}
function owned(t){let n=0;for(let r=0;r<GH;r++)for(let c=0;c<GW;c++)if(grid[r][c].own===t)n++;return n;}
function spawn(t){const b=bases[t],s=new Sol(t,b.x,b.y);s.wpts=[{x:bases[t===PL?EN:PL].x,y:bases[t===PL?EN:PL].y}];soldiers.push(s);}
function sRate(t){return Math.max(600,2200-owned(t)*20);}
function aiInt(){return Math.max(1400,3800-gameTime*.04);}
function burst(x,y,[cr,cg,cb]){
  for(let i=0;i<10;i++){const a=rnd(0,Math.PI*2),sp=rnd(1.5,4.5);particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.8,life:1,sz:rnd(2.5,5.5),fade:rnd(.022,.04),r:cr,g:cg,b:cb});}
  sfx('death');
}

// ══ AI ══
function runAI(now){
  if(now-tAI<aiInt())return;tAI=now;waveNum++;
  const pb=bases[PL],bigWave=waveNum%5===0;
  const mx_=rnd(CW*.26,CW*.5),my_=rnd(HH+55,CH-55);
  const flank=Math.random()<.28+Math.min(.2,gameTime/280000);
  const path=flank
    ?[{x:CW*.56,y:Math.random()<.5?HH+35:CH-35},{x:mx_,y:my_},{x:pb.x,y:pb.y}]
    :[{x:mx_,y:my_},{x:pb.x,y:pb.y}];
  for(const s of soldiers)if(s.t===EN)s.wpts=path.map(p=>({...p}));
  if(bigWave){aiMsg='!! ALL-OUT ASSAULT !!';aiMsgT=3500;sfx('assault');}
  else{aiMsg=flank?'Warning: enemy flanking!':'Warning: enemy advancing!';aiMsgT=2800;sfx('wave');}
}

// ══ INPUT ══
function toCv(e){
  const rect=cv.getBoundingClientRect(),sx=CW/rect.width,sy=CH/rect.height;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-rect.left)*sx,y:cl((src.clientY-rect.top)*sy,HH+5,CH-5)};
}
function commit(){if(pPath.length<2)return;pathA=1;for(const s of soldiers)if(s.t===PL)s.wpts=pPath.map(p=>({...p}));}
function sd(e){if(over){init();return;}getA();drawing=true;pPath=[toCv(e)];ht.style.opacity='0';}
function sm(e){if(!drawing)return;const p=toCv(e),l=pPath[pPath.length-1];if(!l||h2(p.x-l.x,p.y-l.y)>13)pPath.push(p);}
function se(){commit();drawing=false;}
cv.addEventListener('mousedown',sd);
cv.addEventListener('mousemove',sm);
cv.addEventListener('mouseup',se);
cv.addEventListener('mouseleave',se);
cv.addEventListener('touchstart',e=>{e.preventDefault();sd(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();sm(e);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();se();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!over){e.preventDefault();activateSurge();}});

// ══ RENDER ══
function drawGrid(){
  const[pr,pg,pb_]=TC[PL],[er,eg,eb_]=TC[EN];
  for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){
    const ce=grid[r][c],px=c*CS,py=r*CS+HH;
    if(ce.own===0){const v=22+~~(ce.pt*12);cx.fillStyle=`rgb(${v},${v},${v+10})`;}
    else if(ce.own===PL)cx.fillStyle=cc(pr,pg,pb_,.1+ce.pt*.6);
    else cx.fillStyle=cc(er,eg,eb_,.1+ce.pt*.6);
    cx.fillRect(px,py,CS,CS);
  }
  cx.strokeStyle='rgba(255,255,255,.025)';cx.lineWidth=.5;
  for(let r=0;r<=GH;r++){cx.beginPath();cx.moveTo(0,r*CS+HH);cx.lineTo(CW,r*CS+HH);cx.stroke();}
  for(let c=0;c<=GW;c++){cx.beginPath();cx.moveTo(c*CS,HH);cx.lineTo(c*CS,CH);cx.stroke();}
}
function starPath(bx,by){
  cx.beginPath();
  for(let i=0;i<10;i++){const a=(i/5)*Math.PI-Math.PI/2,rr=i%2===0?10:4.5;i===0?cx.moveTo(bx+Math.cos(a)*rr,by+Math.sin(a)*rr):cx.lineTo(bx+Math.cos(a)*rr,by+Math.sin(a)*rr);}
  cx.closePath();
}
function drawBase(t){
  const b=bases[t],[cr,cg,cb]=TC[t],now=performance.now(),pulse=(Math.sin(now*.003)+1)*.5;
  const gw=cx.createRadialGradient(b.x,b.y,5,b.x,b.y,52);
  gw.addColorStop(0,cc(cr,cg,cb,.28));gw.addColorStop(1,cc(cr,cg,cb,0));
  cx.fillStyle=gw;cx.beginPath();cx.arc(b.x,b.y,52,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(b.x,b.y,26+pulse*7,0,Math.PI*2);cx.strokeStyle=cc(cr,cg,cb,.18+pulse*.3);cx.lineWidth=2.5;cx.stroke();
  const bg=cx.createRadialGradient(b.x-8,b.y-8,2,b.x,b.y,22);
  bg.addColorStop(0,`rgb(${mn(cr+60)},${mn(cg+60)},${mn(cb+60)})`);bg.addColorStop(1,`rgb(${cr},${cg},${cb})`);
  cx.beginPath();cx.arc(b.x,b.y,22,0,Math.PI*2);cx.fillStyle=bg;cx.fill();
  cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=2.5;cx.stroke();
  starPath(b.x,b.y);cx.fillStyle='rgba(255,255,255,.9)';cx.fill();
  cx.fillStyle='rgba(255,255,255,.5)';cx.font='bold 9px system-ui';cx.textAlign='center';
  cx.fillText(t===PL?'YOU':'ENEMY',b.x,b.y-29);
  const hr=Math.max(0,b.hp/b.mhp),bw=54,bh=8,bx=b.x-bw/2,by=b.y+29;
  cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(bx-1,by-1,bw+2,bh+2);cx.fillStyle='#1a1a2e';cx.fillRect(bx,by,bw,bh);
  cx.fillStyle=hr>.6?'#44ee88':hr>.3?'#ffcc44':'#ff3344';cx.fillRect(bx,by,bw*hr,bh);
  cx.strokeStyle='rgba(255,255,255,.18)';cx.lineWidth=1;cx.strokeRect(bx,by,bw,bh);
  cx.fillStyle='#fff';cx.font='bold 8px system-ui';cx.textAlign='center';cx.fillText(Math.max(0,~~b.hp),b.x,by+bh-1);
}
function drawPath(){
  const a=drawing?.9:pathA*.9;if(pPath.length<2||a<=0)return;
  cx.save();cx.strokeStyle=cc(105,185,255,a);cx.lineWidth=3.5;cx.lineCap='round';cx.lineJoin='round';
  cx.setLineDash([14,7]);cx.lineDashOffset=-(performance.now()*.065);
  cx.beginPath();cx.moveTo(pPath[0].x,pPath[0].y);for(let i=1;i<pPath.length;i++)cx.lineTo(pPath[i].x,pPath[i].y);
  cx.stroke();cx.setLineDash([]);
  cx.beginPath();cx.arc(pPath[0].x,pPath[0].y,6,0,Math.PI*2);cx.fillStyle=cc(105,200,255,a);cx.fill();
  const L=pPath[pPath.length-1],P2=pPath[pPath.length-2],ag=Math.atan2(L.y-P2.y,L.x-P2.x);
  cx.beginPath();
  cx.moveTo(L.x+Math.cos(ag)*15,L.y+Math.sin(ag)*15);
  cx.lineTo(L.x+Math.cos(ag-2.5)*14,L.y+Math.sin(ag-2.5)*14);
  cx.lineTo(L.x+Math.cos(ag+2.5)*14,L.y+Math.sin(ag+2.5)*14);
  cx.closePath();cx.fillStyle=cc(105,200,255,a);cx.fill();cx.restore();
}
function drawSplats(dt){
  for(const s of splats){s.life-=dt*.0025;const[cr,cg,cb]=TC[s.t];cx.beginPath();cx.arc(s.x,s.y,14*(1-s.life),0,Math.PI*2);cx.fillStyle=cc(cr,cg,cb,s.life*.45);cx.fill();}
  splats=splats.filter(s=>s.life>0);
}
function drawSurgeFlash(){
  if(surgeGlow<=0)return;
  cx.save();cx.globalAlpha=surgeGlow*.18;cx.fillStyle='rgba(70,170,255,1)';cx.fillRect(0,HH,CW,CH-HH);cx.restore();
}
function drawHUD(dt){
  cx.fillStyle='rgba(5,5,18,.94)';cx.fillRect(0,0,CW,HH);cx.fillStyle='rgba(255,255,255,.06)';cx.fillRect(0,HH-1,CW,1);
  const pN=soldiers.filter(s=>s.t===PL).length,eN=soldiers.filter(s=>s.t===EN).length;
  const pC=owned(PL),eC=owned(EN),tot=GW*GH;
  const[pr,pg,pb_]=TC[PL],[er,eg,eb_]=TC[EN];
  cx.fillStyle=cc(pr,pg,pb_);cx.font='bold 13px system-ui';cx.textAlign='left';cx.fillText('Troops: '+pN,14,22);
  cx.fillStyle=cc(er,eg,eb_);cx.textAlign='right';cx.fillText(eN+' :Troops',CW-14,22);
  const bw=220,bh=14,bx=(CW-bw)/2,by=10;
  cx.fillStyle='#0e0e22';cx.fillRect(bx,by,bw,bh);
  if(pC>0){cx.fillStyle=cc(pr,pg,pb_,.85);cx.fillRect(bx,by,bw*pC/tot,bh);}
  if(eC>0){cx.fillStyle=cc(er,eg,eb_,.85);cx.fillRect(bx+bw-bw*eC/tot,by,bw*eC/tot,bh);}
  cx.strokeStyle='rgba(255,255,255,.12)';cx.lineWidth=1;cx.strokeRect(bx,by,bw,bh);
  cx.fillStyle='rgba(255,255,255,.9)';cx.font='bold 9px system-ui';cx.textAlign='center';cx.fillText(~~(pC/tot*100)+'% vs '+~~(eC/tot*100)+'%',CW/2,by+bh-2);
  const sc=~~(gameTime/1000),mm=~~(sc/60),ss=sc%60;
  cx.fillStyle='rgba(180,195,255,.5)';cx.font='11px system-ui';cx.textAlign='left';cx.fillText(mm+':'+(ss<10?'0':'')+ss,14,HH-5);
  cx.textAlign='right';cx.fillText('Wave '+waveNum,CW-14,HH-5);
  if(surgeCD>0){const prog=1-surgeCD/SURGE_CD,bw2=80,bx2=CW/2-bw2/2,by2=HH-9;cx.fillStyle='rgba(40,80,200,.4)';cx.fillRect(bx2,by2,bw2,4);cx.fillStyle='rgba(80,160,255,.8)';cx.fillRect(bx2,by2,bw2*prog,4);}
  if(aiMsgT>0){
    aiMsgT-=dt;const ta=Math.min(1,aiMsgT/500),isAssault=aiMsg.includes('ALL');
    cx.fillStyle=isAssault?cc(255,80,80,ta):cc(255,175,45,ta);
    cx.font=(isAssault?'bold ':' ')+'12px system-ui';cx.textAlign='center';cx.fillText(aiMsg,CW/2,CH-10);
  }
}
function drawOver(){
  cx.fillStyle='rgba(0,0,0,.8)';cx.fillRect(0,0,CW,CH);
  const win=winT===PL;
  cx.fillStyle=win?'#77ffcc':'#ff7788';cx.font='bold 56px system-ui';cx.textAlign='center';cx.fillText(win?'VICTORY!':'DEFEAT!',CW/2,CH/2-32);
  cx.fillStyle='#aab';cx.font='18px system-ui';cx.fillText(win?'You conquered the battlefield!':'The enemy has prevailed...',CW/2,CH/2+12);
  const sc=~~(gameTime/1000),mm=~~(sc/60),ss=sc%60;
  cx.fillStyle='rgba(190,205,255,.6)';cx.font='14px system-ui';cx.fillText('Time: '+mm+':'+(ss<10?'0':'')+ss+'  \u2022  Waves: '+waveNum,CW/2,CH/2+42);
  cx.fillStyle='rgba(255,255,255,.4)';cx.font='13px system-ui';cx.fillText('Click or tap to play again',CW/2,CH/2+72);
}

// ══ GAME LOOP ══
let prevT=0;
function loop(now){
  const dt=Math.min(now-prevT,50);prevT=now;
  if(!over){
    gameTime+=dt;
    if(surgeCD>0){
      surgeCD-=dt;
      if(surgeCD<=0){surgeCD=0;sb.disabled=false;sb.textContent='\u26A1 SURGE \u00a0(Ready!)';}
      else sb.textContent='\u26A1 SURGE \u00a0('+Math.ceil(surgeCD/1000)+'s)';
    }
    if(surgeGlow>0)surgeGlow=Math.max(0,surgeGlow-dt*.0035);
    if(now-tSpP>sRate(PL)&&soldiers.filter(s=>s.t===PL).length<65){tSpP=now;spawn(PL);}
    if(now-tSpE>sRate(EN)&&soldiers.filter(s=>s.t===EN).length<65){tSpE=now;spawn(EN);}
    runAI(now);
    const alive=soldiers.filter(s=>s.hp>0);
    for(const s of alive)s.update(dt,alive);
    soldiers=soldiers.filter(s=>{if(s.hp<=0){burst(s.x,s.y,TC[s.t]);return false;}return true;});
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.vx*=.97;p.life-=p.fade;}
    particles=particles.filter(p=>p.life>0);
    if(!drawing)pathA=Math.max(0,pathA-dt/2500);
    bases[PL].hp=Math.min(bases[PL].mhp,bases[PL].hp+dt*.0018);
    bases[EN].hp=Math.min(bases[EN].mhp,bases[EN].hp+dt*.0018);
    if(bases[PL].hp<=0){over=true;winT=EN;sfx('lose');sb.disabled=true;sb.textContent='\u26A1 SURGE';}
    if(bases[EN].hp<=0){over=true;winT=PL;sfx('win');sb.disabled=true;sb.textContent='\u26A1 SURGE';}
  }
  cx.fillStyle='#0d0d1e';cx.fillRect(0,0,CW,CH);
  drawGrid();drawSurgeFlash();drawSplats(dt);
  drawBase(PL);drawBase(EN);
  for(const p of particles){cx.beginPath();cx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);cx.fillStyle=cc(p.r,p.g,p.b,p.life);cx.fill();}
  for(const s of soldiers)s.draw();
  drawPath();drawHUD(dt);
  if(over)drawOver();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
